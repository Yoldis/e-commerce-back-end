

services:
    api:
        container_name: api
        image: node:22-alpine
        working_dir: /app
        command: sh -c "npm install && npx prisma generate && npm start"
        volumes:
            - ./:/app
            - /app/node_modules
        ports:
            - ${PORT}:3000
        environment:
            - DATABASE_URL=${DATABASE_URL}
        expose:
            - ${PORT}
        